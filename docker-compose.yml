# Budget Insights Narrator - plain Postgres + Django backend + React
# frontend. No pgvector/vector DB, no Celery/Redis: the only AI-specific
# piece is a single synchronous OpenAI chat-completion call
# (apps/common/ai.py), stubbed deterministically when OPENAI_API_KEY is
# unset, so there is nothing async to desync.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budget_insights_narrator}
      POSTGRES_USER: ${POSTGRES_USER:-budget_insights_narrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget_insights_narrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budget_insights_narrator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
